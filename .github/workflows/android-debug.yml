name: Android Debug Build

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install web dependencies
        run: npm ci

      - name: Type-check and build web assets
        run: npm run build

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Add Android platform (if not already present)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Pin SDK versions (compileSdk/targetSdk 36, minSdk 24)
        run: |
          VARS=android/variables.gradle
          sed -i "s/minSdkVersion = .*/minSdkVersion = 24/" "$VARS"
          sed -i "s/compileSdkVersion = .*/compileSdkVersion = 36/" "$VARS"
          sed -i "s/targetSdkVersion = .*/targetSdkVersion = 36/" "$VARS"
          cat "$VARS"

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: afaq-al-iman-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
